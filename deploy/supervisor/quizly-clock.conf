; Supervisor program for the Quizly game clock (php artisan quizly:clock) in production.
; Copy it to /etc/supervisor/conf.d/ and adjust the paths and user.
;
; The clock handles its own errors and backs off while e.g. the database is
; down, so it should rarely exit. If it does exit straight away (say, during a
; deploy or while the server boots), keep trying: supervisor's default of 3
; quick retries would leave every game frozen.

[program:quizly-clock]
command=php /var/www/quizly/current/artisan quizly:clock
directory=/var/www/quizly/current
user=www-data
autostart=true
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/quizly/clock.log
