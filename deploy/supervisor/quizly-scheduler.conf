; Supervisor program for Laravel's scheduler (room expiry, pruning old games) in production.
; Copy it to /etc/supervisor/conf.d/ and adjust the paths and user.
; Alternatively, run `php artisan schedule:run` from cron every minute instead.

[program:quizly-scheduler]
command=php /var/www/quizly/current/artisan schedule:work
directory=/var/www/quizly/current
user=www-data
autostart=true
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/quizly/scheduler.log
