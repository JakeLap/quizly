; Production PHP settings for Quizly's image (on top of php.ini-production).

; Octane, Reverb and the clock all run PHP from the command line, so OPcache
; has to be on for the CLI too. The code never changes inside a container.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Off until PHP ships the fix for CVE-2026-115560, as PHP's 23 Oct 2026
; advisory suggests. It has to be set here: ini_set() is too late. Laravel
; keeps its own sessions, so nothing uses this.
session.upload_progress.enabled = 0

memory_limit = 256M
expose_php = Off
variables_order = EGPCS

; The app logs to stderr; PHP's own errors go there too.
log_errors = On
error_log = /proc/self/fd/2
