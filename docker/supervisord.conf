; Runs all of Quizly in one container (the image's default, `all`): the site,
; the websocket server, the game clock and the scheduler. Each restarts on its
; own if it stops, and logs to the container's output.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=/var/www/html/docker/entrypoint.sh web --no-setup
stopsignal=TERM
stopwaitsecs=30
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:reverb]
command=/var/www/html/docker/entrypoint.sh reverb --no-setup
stopsignal=TERM
stopwaitsecs=10
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The clock handles its own errors and backs off while e.g. the database is
; down, so it rarely exits; if it does, keep trying, or every game freezes.
[program:clock]
command=/var/www/html/docker/entrypoint.sh clock --no-setup
stopsignal=TERM
stopwaitsecs=15
autorestart=true
startsecs=1
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/var/www/html/docker/entrypoint.sh scheduler --no-setup
stopsignal=TERM
stopwaitsecs=60
autorestart=true
startsecs=1
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
